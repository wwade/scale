name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache APT Packages
        uses: wwade/cache-apt-pkgs-action@0ddaf3f3ad9d8ecda6b41fe27004c36a21069d63 # v1.6.0-node24
        with:
          version: 0 # cache key
          packages: libglib2.0-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff lint
        run: uv run ruff check

      - name: Ruff format check
        run: uv run ruff format --check

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache APT Packages
        uses: wwade/cache-apt-pkgs-action@0ddaf3f3ad9d8ecda6b41fe27004c36a21069d63 # v1.6.0-node24
        with:
          version: 0 # cache key
          packages: libglib2.0-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --dev

      - name: Run pytest
        run: uv run pytest
